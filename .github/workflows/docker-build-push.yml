name: Docker Build, Push, and Deploy

on:
  push:
    branches:
      - week02

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy latest image on EC2 (SSM)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/cs6620-app:latest"
          CONTAINER_NAME="cs6620-app"
          COMMENT="Auto deploy via GA+SSM run:${GITHUB_RUN_ID}"

          aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "$COMMENT" \
            --parameters commands="[
              \"set -e\",
              \"IMAGE=${DOCKERHUB_USERNAME}/cs6620-app:latest\",
              \"CONTAINER_NAME=cs6620-app\",

              \"# Ensure Docker is installed (Amazon Linux / Ubuntu)\",
              \"if ! command -v docker >/dev/null 2>&1; then\",
              \"  if command -v yum >/dev/null 2>&1; then\",
              \"    sudo yum update -y\",
              \"    if sudo yum list docker >/dev/null 2>&1; then\",
              \"      sudo yum install -y docker\",
              \"    else\",
              \"      sudo amazon-linux-extras install docker -y || sudo yum install -y docker\",
              \"    fi\",
              \"  elif command -v apt-get >/dev/null 2>&1; then\",
              \"    sudo apt-get update -y\",
              \"    sudo apt-get install -y docker.io\",
              \"  else\",
              \"    echo 'Unsupported OS: cannot auto-install docker' >&2; exit 1\",
              \"  fi\",
              \"fi\",

              \"# Start/enable Docker daemon (systemd)\",
              \"sudo systemctl enable docker || true\",
              \"sudo systemctl start docker || true\",

              \"# Deploy container\",
              \"sudo docker pull $IMAGE\",
              \"sudo docker stop $CONTAINER_NAME || true\",
              \"sudo docker rm $CONTAINER_NAME || true\",
              \"sudo docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 80:5000 $IMAGE\"
            ]"

